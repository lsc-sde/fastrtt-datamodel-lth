[project]
name = "fastrtt-datamodel-lth"
version = "0.1.0"
description = "Data model for the FastRTT project at LTH: incomplete RTT pathways linked to OMOP person_id"
authors = [{ name = "vvcb" }]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "python-dotenv",
    "sqlmesh[mssql,lsp]~=0.228.4",
    "sqlalchemy",
    "pyodbc",
]

[dependency-groups]
dev = ["jupyterlab>=4.4.7", "pre-commit>=4.3.0", "ruff"]
[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
